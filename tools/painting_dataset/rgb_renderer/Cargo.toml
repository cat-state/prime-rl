[package]
name = "painting-rgb-renderer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
bytemuck = "1.24"
image = { version = "0.25.10", default-features = false, features = ["png"] }
naga = { version = "29", default-features = false, features = ["wgsl-in"] }
pollster = "0.4"
serde_json = "1"
wgpu = { version = "29", default-features = false, features = ["metal", "vulkan", "wgsl"] }
